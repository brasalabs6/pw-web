# Non-secret user-level model catalog. CI installs this at $GROK_HOME/config.toml.
# Project .grok/config.toml does NOT support [model.*] overrides.
# Never commit credentials; all models use env_key = "CF_PROXY_API_KEY".
[cli]
auto_update = false

[models]
default = "cf-glm-5.3"
default_reasoning_effort = "low"
session_summary = "cf-glm-5.3-flash"
image_description = "cf-glm-5.3-flash"

[model."cf-glm-5.2"]
model = "@cf/zai-org/glm-5.2"
base_url = "https://cf-ai-rate-proxy.guibelongtovi-a22.workers.dev/v1"
name = "CF GLM 5.2 (Brasamain Worker Proxy)"
description = "Z.ai GLM-5.2 via deployed Brasamain Cloudflare Worker rate proxy"
api_backend = "chat_completions"
env_key = "CF_PROXY_API_KEY"
context_window = 262144
max_completion_tokens = 16384
temperature = 0.7
stream_tool_calls = true
vision = false

