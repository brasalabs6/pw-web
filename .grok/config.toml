# Project-scoped Grok config: MCP and permissions only. Models live at GROK_HOME/config.toml.
# Chrome must be installed separately. Chrome DevTools MCP runs an isolated headless profile.
# CI's PATH includes a pinned local install of chrome-devtools-mcp, no npx @latest.
[mcp]
max_output_bytes = 40000

[mcp_servers.chrome-devtools]
command = "chrome-devtools-mcp"
args = ["--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120
