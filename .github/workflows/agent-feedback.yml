name: Agent CI Feedback
on:
  workflow_run:
    workflows: ["Bootstrap CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    if: github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add factual CI outcome to the agent PR (DO NOT dispatch repairs)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^agent/([a-z][a-z0-9-]{2,70})/(wo-[0-9]{2})$ ]]; then exit 0; fi
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq '.object.sha')" || exit 0
          [ "$CURRENT" = "$SHA" ] || { echo "Stale CI result, ignored"; exit 0; }
          PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          [ -n "$PR" ] || exit 0
          MSG="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.commit.message')"
          if [[ ! "$MSG" =~ \[agent-attempt:([0-9]{1,2})\] ]]; then exit 0; fi
          ROUND="${BASH_REMATCH[1]}"
          gh pr comment "$PR" --body "CI evidence: run #$CI_RUN_ID for commit \`$SHA\` / round $ROUND = **$CONCLUSION**. https://github.com/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID. Reparos são coordenados exclusivamente pelo Agent Dual Review após dois relatórios e CI."
          echo "Recorded CI=$CONCLUSION for PR #$PR. No competing retry dispatched." >> "$GITHUB_STEP_SUMMARY"
