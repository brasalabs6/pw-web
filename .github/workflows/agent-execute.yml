name: Agent Execute
on:
  workflow_dispatch:
    inputs:
      epic:
        description: "Versioned epic slug (e.g. e04-wasm-core-v1)"
        required: true
        type: string
      workorder:
        description: "Workorder ID from epic/workorders (e.g. wo-01)"
        required: true
        type: string
      dry_run:
        description: "Validate workflow without API key, code changes or PR"
        required: true
        default: false
        type: boolean
      attempt:
        description: "Bounded attempt 1..3 (1 = new PR, 2/3 = fix failed CI)"
        required: true
        default: "1"
        type: string

concurrency:
  group: pw-agent-${{ inputs.epic }}-${{ inputs.workorder }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.validate.outputs.branch }}
      checkout_ref: ${{ steps.validate.outputs.checkout_ref }}
      attempt: ${{ steps.validate.outputs.attempt }}
      epic: ${{ steps.validate.outputs.epic }}
      workorder: ${{ steps.validate.outputs.workorder }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          submodules: false
      - name: Enforce declared dependencies before first dispatch
        if: inputs.attempt == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          EPIC: ${{ inputs.epic }}
          WO: ${{ inputs.workorder }}
        run: |
          gh pr list --state merged --limit 500 --json title > /tmp/merged-prs.json
          python3 .agents/automation/backlog_pick.py --merged /tmp/merged-prs.json --require "$EPIC/$WO"
      - id: validate
        run: |
          python3 .agents/automation/validate_dispatch.py \
            --epic "$EPIC" --workorder "$WORKORDER" --attempt "$ATTEMPT" --output "$GITHUB_OUTPUT"
        env:
          EPIC: ${{ inputs.epic }}
          WORKORDER: ${{ inputs.workorder }}
          ATTEMPT: ${{ inputs.attempt }}
      - name: Confirm branch exists before any repair
        if: steps.validate.outputs.attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.validate.outputs.branch }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" > /dev/null

  coder:
    if: inputs.dry_run != true
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          submodules: false
          persist-credentials: false
      - name: Prepare workspace and prompt (no model secret yet)
        env:
          EPIC: ${{ needs.prepare.outputs.epic }}
          WO: ${{ needs.prepare.outputs.workorder }}
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/agent
          if [ "$ATTEMPT" != '1' ]; then
            PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
            if [ -n "$PR" ]; then
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --paginate > artifacts/agent/comments.json
              python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('artifacts/agent/comments.json')
          try:
              comments=json.loads(p.read_text())
              reviews=[c['body'] for c in comments if c.get('user',{}).get('login')=='github-actions[bot]' and c.get('body','').startswith('<!-- pw-agent-review ')]
              if reviews: pathlib.Path('artifacts/agent/prior-review.md').write_text(reviews[-1][-18000:],encoding='utf-8')
          except (json.JSONDecodeError,KeyError,TypeError): pass
          PY
            fi
            gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --limit 8 --json databaseId,conclusion \
              | python3 -c 'import json,sys; v=[str(r["databaseId"]) for r in json.load(sys.stdin) if r.get("conclusion")=="failure"]; print(v[0] if v else "")' > artifacts/agent/previous-run-id
            RUN_ID="$(cat artifacts/agent/previous-run-id)"
            if [ -n "$RUN_ID" ]; then
              gh run view "$RUN_ID" --log-failed > artifacts/agent/prior-ci.log || true
            fi
          fi
          python3 .agents/automation/build_prompt.py \
            --epic "$EPIC" --workorder "$WO" --attempt "$ATTEMPT" \
            --ci-log artifacts/agent/prior-ci.log --review-file artifacts/agent/prior-review.md --output artifacts/agent/prompt.md
      - name: Install pinned Grok Build CLI (no proxy key in install)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Grok Build
        run: |
          npm install --prefix "$RUNNER_TEMP/grok-build" --no-audit --no-fund "@xai-official/grok@1.0.70"
          echo "$RUNNER_TEMP/grok-build/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Chrome for Testing for in-run visual inspection
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install isolated Chrome DevTools MCP without proxy credential
        run: |
          npm install --prefix "$RUNNER_TEMP/pw-browser" --no-audit --no-fund chrome-devtools-mcp@1.12.0
          echo "$RUNNER_TEMP/pw-browser/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start localhost-only PW Web WebGL diagnostic for the coding agent
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p artifacts/browser
          nohup python3 -m http.server 8080 --bind 127.0.0.1 --directory web > artifacts/browser/http.log 2>&1 &
          echo $! > artifacts/browser/server.pid
          for i in $(seq 1 25); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 0.2
          done
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install user-scoped model config from tracked non-secret catalog
        env:
          GROK_HOME: ${{ runner.temp }}/pw-grok-coder
        run: bash scripts/configure-grok-models.sh
      - name: Validate proxy key is configured
        env:
          KEY_CONFIGURED: ${{ secrets.CF_PROXY_API_KEY != '' }}
        run: |
          if [ "$KEY_CONFIGURED" != "true" ]; then
            echo "::error::Set repository secret CF_PROXY_API_KEY for the Cloudflare proxy."
            exit 1
          fi
      - name: Execute Grok Build coder under dedicated CF GLM 5.3 agent profile
        env:
          CF_PROXY_API_KEY: ${{ secrets.CF_PROXY_API_KEY }}
          GROK_HOME: ${{ runner.temp }}/pw-grok-coder
          GROK_MODEL: cf-glm-5.3
          GROK_AGENT_PROFILE: .grok/agents/coder.md
          GROK_SANDBOX: strict
          GROK_SCHEMA_ROLE: coder
        run: bash scripts/run-grok-workorder.sh artifacts/agent/prompt.md artifacts/agent/final.json
      - name: Serialize patch and diagnostics
        if: success()
        run: |
          git add -N -A
          git -c diff.renames=false diff --binary --no-ext-diff HEAD > artifacts/agent/change.patch
          test -s artifacts/agent/change.patch
          echo "Patch bytes: $(wc -c < artifacts/agent/change.patch)"
      - name: Upload untrusted patch for independently isolated review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pw-agent-patch-${{ github.run_id }}
          path: |
            artifacts/agent/
            artifacts/browser/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: inputs.dry_run != true
    needs: [prepare, coder]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: false
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: pw-agent-patch-${{ github.run_id }}
          path: /tmp/pw-agent
      - name: Validate untrusted patch using MAIN branch policy
        env:
          EPIC: ${{ needs.prepare.outputs.epic }}
          WO: ${{ needs.prepare.outputs.workorder }}
        run: |
          python3 .agents/automation/validate_patch.py \
            --epic "$EPIC" --workorder "$WO" --patch /tmp/pw-agent/change.patch
      - name: Commit isolated patch and request CI on its branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          EPIC: ${{ needs.prepare.outputs.epic }}
          WO: ${{ needs.prepare.outputs.workorder }}
          ATTEMPT: ${{ needs.prepare.outputs.attempt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$ATTEMPT" = "1" ]; then
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              echo "Branch exists; refusing accidental overwrite" >&2
              exit 1
            fi
            git switch -c "$BRANCH"
          else
            git fetch origin "$BRANCH"
            git switch -c "$BRANCH" FETCH_HEAD
          fi
          git apply --check /tmp/pw-agent/change.patch
          git apply --binary /tmp/pw-agent/change.patch
          git add -A
          git diff --cached --quiet && { echo "No changes to publish" >&2; exit 1; }
          git commit -m "agent: $EPIC/$WO [agent-attempt:$ATTEMPT]"
          git push origin "HEAD:refs/heads/$BRANCH"
          if [ "$ATTEMPT" = "1" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "agent: $EPIC / $WO" \
              --body "Bounded Grok Build workorder. Evidence: Agent Execute #$GITHUB_RUN_ID. Two independent model reviewers + CI; human merge only. See .agents/epics/$EPIC/workorders/$WO.json" \
              --draft
          fi
          PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          [ -n "$PR" ] || { echo "PR not found after push"; exit 1; }
          if [ "$ATTEMPT" = "1" ]; then
            gh pr ready "$PR"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Patch published and review requested: $BRANCH PR #$PR SHA $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run ci.yml --ref "$BRANCH"
          # PR events generated by GITHUB_TOKEN may be suppressed: explicitly dispatch review.
          gh workflow run agent-review.yml --ref main \
            -f pr_number="$PR" -f head_sha="$HEAD_SHA" -f round="$ATTEMPT"
          echo "Dispatched independent DeepSeek and GLM Flash reviewers." >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    if: inputs.dry_run == true
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: false
          persist-credentials: false
      - name: Prove workorder selection, constraints, generated prompt and tests
        env:
          EPIC: ${{ needs.prepare.outputs.epic }}
          WO: ${{ needs.prepare.outputs.workorder }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/dry-run
          python3 .agents/automation/epic_check.py | tee artifacts/dry-run/catalog.json
          python3 .agents/automation/build_prompt.py \
            --epic "$EPIC" --workorder "$WO" --attempt 1 \
            --output artifacts/dry-run/prompt.md
          bash scripts/verify.sh 2>&1 | tee artifacts/dry-run/verify.log
          echo "Dry-run: policy and local tests passed. No model call, patch or PR was created." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pw-agent-dry-run-${{ github.run_id }}
          path: artifacts/dry-run/
          retention-days: 14
