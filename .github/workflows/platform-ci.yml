name: Platform 7 apps CI
on:
  push:
    branches: [feat/multi-realm-platform-shell-mvp]
    paths: ['apps/**','packages/**','tests/platform/**','Cargo.toml','package.json','tsconfig.platform.json','.github/workflows/platform-ci.yml']
  pull_request:
    paths: ['apps/**','packages/**','tests/platform/**','Cargo.toml','package.json','tsconfig.platform.json','.github/workflows/platform-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript-and-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pw
          POSTGRES_PASSWORD: pw_local_only
          POSTGRES_DB: pw_control
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pw -d pw_control"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://pw:pw_local_only@127.0.0.1:5432/pw_control
      API_PUBLIC_URL: http://127.0.0.1:8787
      API_PORT: '8787'
      APP_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, submodules: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run test:platform
      - run: npm run db:migrate
      - name: PostgreSQL + HTTP smoke
        shell: bash
        run: |
          npm run dev:api > /tmp/pw-platform-api.log 2>&1 &
          node tests/platform/api-smoke.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pw-platform-api-log
          path: /tmp/pw-platform-api.log
          if-no-files-found: ignore
  rust-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, submodules: false}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
