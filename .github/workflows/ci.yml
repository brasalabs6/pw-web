name: Bootstrap CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core-and-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project (do not download third-party source)
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Verify bootstrap and portable C++
        run: bash scripts/verify.sh
