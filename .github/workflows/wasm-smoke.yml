name: WASM Smoke (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Install Emscripten (Ubuntu distribution package)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y emscripten
      - name: Compile isolated C++ -> wasm
        run: bash scripts/build-wasm.sh
      - name: Confirm emitted artifacts
        run: |
          test -s web/wasm/pw_core.mjs
          test -s web/wasm/pw_core.wasm
