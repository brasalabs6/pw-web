# DEVELOPMENT ONLY. No game WDB is stored here.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pw
      POSTGRES_PASSWORD: pw_local_only
      POSTGRES_DB: pw_control
    ports: ["127.0.0.1:5433:5432"]
    volumes: [control_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pw -d pw_control"]
      interval: 3s
      timeout: 3s
      retries: 12
volumes:
  control_pg_data:
