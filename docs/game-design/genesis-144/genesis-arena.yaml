      category: "class_gems"
      role: "balanced_pvp_build"
      template_ids: "TBD"
    -
      category: "pvp_consumables"
      role: "free_or_very_low_cost"
      template_ids: "TBD"
    -
      category: "flight_mount"
      role: "accessible_starter"
      template_ids: "TBD"
  full_gear_item_id_inventory:
    status: "pending_era_audit"
    note: "Extrair IDs, classes, slots, requisitos e atributos do snapshot 1.4.4"
  free_kit_salvage_to_currency: false
  free_kit_resell: false
  tradeable_materials_for_upgrade:
    status: "proposed"
    value: true
  upgrade_slots: "only_when_refine_allowed_in_canonical_patch"
  crafting:
    from_10_to_11: "earnable"
    from_11_to_12: "earnable"
    total_set_reset_on_failure: false
  future_rank9_override: false
  post_era_recast_allowed: false
  max_refine_above_12: false
  power_smoothing:
    status: "proposed"
    apply_only_to_this_realm: true
    formula: "effective(r>10) = raw(10) + alpha*(raw(r)-raw(10))"
    alpha: 0.35
    historical_until_refine: 10
    affected_stats:
      - "attack_refine_bonus"
      - "hp_refine_bonus"
      - "defense_refine_bonus_where_supported"
    server_authoritative: true
    visible_in_ui: true
    requires_validation_per_class_slot_and_matchup: true
    expected_effect: "reduz discrepância sem apagar conquista +12"
